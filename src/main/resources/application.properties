server.port=8081

# logging
logging.level.root=info
bpi.logging.interceptor.soap.enabled=false

bpi.soap.api.configure.enabled=false

bpi.web.exceptionhandler.type=default

# multi-environment
bpi.backendadapter.enabled=true

# origins webservice
bpi.rest.origins.basePath=http://localhost:8089
bpi.rest.origins.hello-world-service-endpoint=/hello
bpi.rest.origins.authorization=${ORIGINS_LOSR1}${ORIGINS_LOSR2}${ORIGINS_LOSR3}${ORIGINS_LOSR4}${ORIGINS_LOSR5}

# connection manager
bpi.rest.conn.pool.max-total=150
bpi.rest.conn.pool.default-max-per-route=50
bpi.rest.conn.pool.evict-idle-connection-sleep-time=15000
bpi.rest.conn.pool.max-idle-time=15000
bpi.rest.conn.pool.time-to-live=1800000

# soap ssl
bpi.ssl.soap.enabled=false
bpi.ssl.soap.disableCNCheck=true
bpi.ssl.soap.ciphers.include=.*_EXPORT_.*, .*_EXPORT1024_.*, .*_WITH_DES_.*, .*_WITH_NULL_.*, .*_WITH_AES_.*
bpi.ssl.soap.ciphers.exclude=.*_DH_anon_.*

# rest ssl
bpi.ssl.rest.enabled=false
bpi.ssl.rest.protocol=TLSv1, TLSv1.1, TLSv1.2
bpi.ssl.rest.disableCNCheck=true
bpi.ssl.rest.ciphers=TLS_RSA_WITH_AES_256_CBC_SHA

# security
app.policies=classpath:policies/policy.yml
app.context=KEYSTORE,TRUSTSTORE,MONGO
app.
app.credsFilePath=src/main/resources/policies/global.secret.enc.properties
app.certStorePath=src/main/resources

BUSINESS.bpi.rest.origins.basePath=http://localhost:8080/mock/businessError
SERVICE.bpi.rest.origins.basePath=http://localhost:8080/mock/serviceError
TIMEOUT.bpi.rest.origins.basePath=http://localhost:8080/mock/timeout
